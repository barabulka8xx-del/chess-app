name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Install Buildozer with pinned dependencies
      run: |
        pip install --upgrade pip
        pip install "buildozer==1.5.0" "cython==0.29.33"

    - name: Download Font (Auto)
      run: |
        curl -L -o DejaVuSans.ttf https://cdn.jsdelivr.net/gh/matplotlib/matplotlib@main/lib/matplotlib/mpl-data/fonts/ttf/DejaVuSans.ttf

    # Убираем кэш, чтобы не тянуть старые ошибки
    - name: Build APK
      env:
        GRADLE_OPTS: "-Xmx2g -Dorg.gradle.daemon=false"
        JAVA_OPTS: "-Xmx2g"
      run: |
        buildozer -v android debug --no-parallel

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-chess-apk
        path: bin/*.apk
