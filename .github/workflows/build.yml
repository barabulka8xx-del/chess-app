name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Понижаем Python до 3.9 для стабильной сборки pyjnius
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Install Buildozer with pinned dependencies
      run: |
        pip install --upgrade pip
        pip install "buildozer==1.5.0" "cython==0.29.33"

    - name: Download Font (Auto)
      run: |
        curl -L -o DejaVuSans.ttf https://cdn.jsdelivr.net/gh/matplotlib/matplotlib@main/lib/matplotlib/mpl-data/fonts/ttf/DejaVuSans.ttf

    - name: Restore Keystore
      run: |
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          echo "Keystore created."
        else
          echo "No keystore secret found. Building debug."
        fi

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    # Очистка перед сборкой, чтобы сбросить старые ошибки
    - name: Clean Buildozer
      run: buildozer android clean

    - name: Build APK
      env:
        P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/release.keystore
        P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
        P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
        P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -s "release.keystore" ]; then
          echo "Keystore найден! Запускаем сборку RELEASE..."
          buildozer -v android release
        else
          echo "Keystore НЕ найден! Запускаем сборку DEBUG..."
          buildozer -v android debug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-chess-apk
        path: bin/*.apk
